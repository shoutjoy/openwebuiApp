                    <legend className="text-sm font-bold">GitHub 연결</legend>
                    <label className="text-xs block">GitHub 토큰<input type="password" autoComplete="off" aria-label="GitHub 토큰" value={github.token||''} onChange={e=>updateGithub('token',e.target.value)} className="w-full bg-slate-950 p-2 rounded"/></label>
                    <label className="text-xs block">저장소<input aria-label="GitHub 저장소" placeholder="owner/repository" value={github.repo||''} onChange={e=>updateGithub('repo',e.target.value)} className="w-full bg-slate-950 p-2 rounded"/></label>
                    <label className="text-xs block">브랜치<input aria-label="GitHub 브랜치" placeholder="비우면 기본 브랜치" value={github.branch||''} onChange={e=>updateGithub('branch',e.target.value)} className="w-full bg-slate-950 p-2 rounded"/></label>
                    <p className="text-xs text-slate-400">토큰은 현재 창의 메모리에만 유지되며 앱 다운로드·전체 백업에는 포함되지 않습니다. 새로고침 후 다시 입력하세요. 선택한 저장소의 Contents 읽기/쓰기 권한이 필요합니다.</p>
                    <button disabled={githubChecking} className="bg-indigo-600 p-2 rounded text-xs" onClick={async()=>{setGithubChecking(true);setGithubStatus('연결 확인 중…');try{const result=await checkGitHub({...github});setGithubStatus(result.login+' · '+result.repo+' / '+result.branch+' 읽기 연결 확인 (쓰기는 커밋 시 검증)');}catch(e){setGithubStatus(e.message);}finally{setGithubChecking(false);}}}>{githubChecking?'확인 중…':'GitHub 연결 확인'}</button>
                    <p className="text-xs" role="status">{githubStatus}</p>
                  </fieldset>
                  {/* Endpoint Switch */}
                  <div>
                    <label className="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-2">
                      서버 연결 유형
                    </label>
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => { setEndpointType('local'); setIsDemoMode(false); }}
                        className={`p-3 rounded-xl border text-left transition-all ${
                          endpointType === 'local' && !isDemoMode
                            ? 'bg-indigo-950/60 border-indigo-500/50 text-indigo-200'
                            : 'bg-slate-950/50 border-slate-800 text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <div className="font-semibold text-xs text-white">🖥️ 로컬 PC Ollama</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">127.0.0.1:11434</div>
                      </button>

                      <button
                        type="button"
                        onClick={() => { setEndpointType('online'); setIsDemoMode(false); }}
                        className={`p-3 rounded-xl border text-left transition-all ${
                          endpointType === 'online' && !isDemoMode
                            ? 'bg-indigo-950/60 border-indigo-500/50 text-indigo-200'
                            : 'bg-slate-950/50 border-slate-800 text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <div className="font-semibold text-xs text-white">🌐 온라인 / 원격 / Docker</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">원격 IP/도메인 지정</div>
                      </button>
                    </div>
                  </div>

                  {/* Simulator Toggle */}
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <div>
                      <span className="text-xs font-semibold text-white flex items-center gap-1.5">
                        ✨ 시뮬레이터 / 데모 모드
                      </span>
                      <p className="text-[11px] text-slate-400 mt-0.5">Ollama 서버 없이도 모든 모드를 즉시 체험</p>
                    </div>
                    <input
                      type="checkbox"
                      checked={isDemoMode}
                      onChange={(e) => setIsDemoMode(e.target.checked)}
                      className="w-4 h-4 accent-indigo-500 rounded cursor-pointer"
                    />
                  </div>

                  {/* URLs */}
                  {!isDemoMode && (
                    endpointType === 'local' ? (
                      <div>
                        <label className="text-xs font-medium text-slate-400 block mb-1.5">로컬 주소</label>
                        <input
                          type="text"
                          value={localUrl}
                          onChange={(e) => setLocalUrl(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 font-mono outline-none focus:border-indigo-500"
                          placeholder="http://127.0.0.1:11434"
                        />
                      </div>
                    ) : (
                      <div>
                        <label className="text-xs font-medium text-slate-400 block mb-1.5">원격 / 도커 서버 URL</label>
                        <input
                          type="text"
                          value={onlineUrl}
                          onChange={(e) => setOnlineUrl(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 font-mono outline-none focus:border-indigo-500"
                          placeholder="https://ollama.your-domain.com 또는 http://192.168.0.10:11434"
                        />
                      </div>
                    )
                  )}

                  {/* Temperature */}
                  <div>
                    <div className="flex items-center justify-between text-xs mb-1.5">
                      <span className="text-slate-300 font-medium">생성 다양성 (Temperature): {temperature}</span>
                      <span className="text-slate-500 text-[11px]">0.0 (정밀) ~ 1.0 (창의적)</span>
                    </div>
                    <input
                      type="range"
                      min="0.0"
                      max="1.0"
                      step="0.1"
                      value={temperature}
                      aria-label="생성 다양성"
                      onChange={(e) => updateGenerationSetting('temperature',parseFloat(e.target.value))}
                      className="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                    />
                    <p className="text-[11px] text-slate-400 mt-2">모든 대화 모드에 적용됩니다. 아래 빈 항목은 Ollama 서버·모델 기본값을 사용합니다.</p>
                  </div>
                  <fieldset className="p-3 rounded-xl border border-slate-700 space-y-3">
                    <legend className="text-xs font-semibold text-indigo-300">로컬 모델 생성 설정</legend>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {GENERATION_FIELDS.map(field=>(
                        <label key={field.key} className="block text-xs text-slate-300">
                          {field.label}
                          <input type="number" aria-label={field.label} min={field.min} max={field.max} step={field.step}
                            value={generationSettings[field.key]} onChange={e=>updateGenerationSetting(field.key,e.target.value)}
                            placeholder="서버 기본값" className="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 outline-none focus:border-indigo-500"/>
                          <span className="block mt-1 text-[10px] text-slate-500">{field.hint}</span>
                        </label>
                      ))}
                    </div>
                    <label className="block text-xs text-slate-300">추론 사용
                      <select aria-label="추론 사용" value={generationSettings.thinking} onChange={e=>updateGenerationSetting('thinking',e.target.value)} className="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2">
                        <option value="auto">자동 (추론 모드에서 켬 / 그 외 모델 기본값)</option>
                        <option value="on">켜기 (추론 지원 모델)</option>
                        <option value="off">끄기 (GPT-OSS 제외)</option>
                      </select>
                    </label>
                    <label className="block text-xs text-slate-300">추론 강도 (GPT-OSS)
                      <select aria-label="추론 강도 (GPT-OSS)" value={generationSettings.effort} onChange={e=>updateGenerationSetting('effort',e.target.value)} disabled={generationSettings.thinking==='off'} className="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2 disabled:opacity-50">
                        <option value="low">낮음 (Low)</option><option value="medium">보통 (Medium)</option><option value="high">높음 (High)</option>
                      </select>
                    </label>
                    <p className="text-[11px] text-amber-300/90 leading-relaxed">추론 전용 토큰량: Ollama 공통 API에서 별도 수치 제한을 지원하지 않습니다. 최대 생성 토큰으로 추론과 답변의 전체 한도를 조절하세요. 한도가 작으면 추론 도중 종료되어 답변이 없을 수 있습니다. GPT-OSS는 추론을 끌 수 없으며 강도로 조절합니다.</p>
                    <p className="text-[11px] text-slate-400">설정은 모든 모델에 공통 적용되며 ‘저장 및 연결 테스트’로 이 브라우저에 저장됩니다. 모델별 지원 여부·최대 컨텍스트는 다릅니다. 문서 전체 백업에는 포함되지 않습니다.</p>
                    <button type="button" onClick={()=>{setGenerationSettings({...GENERATION_DEFAULTS});setGenerationError('');}} className="text-xs text-indigo-300 hover:text-indigo-200">생성 설정 기본값으로</button>
                  </fieldset>
                  {generationError && <p role="alert" className="text-xs text-rose-400">{generationError}</p>}
                </div>

                <div className="p-4 bg-slate-950/60 border-t border-slate-800 flex justify-end gap-2 shrink-0">
                  <button
                    onClick={() => {
                      try{
                        buildGenerationSettings(generationSettings,selectedModel||customModelInput.trim(),activeMode);
                        localStorage.setItem('ollama-say-generation',JSON.stringify(generationSettings));
                        setGenerationError('');
                      }catch(err){setGenerationError('저장 실패: '+err.message);return;}
                      fetchModelList(activeUrl);
                      setIsSettingsOpen(false);
                      showToast('설정이 반영되었습니다.', 'success');
                    }}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-md transition-colors"
                  >
                    저장 및 연결 테스트
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CORS & SETUP HELP MODAL */}
          {isCorsHelpOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2 text-indigo-400 font-bold">
                    <span>❓</span>
                    <h3 className="text-slate-100">로컬 Ollama 연결 가이드</h3>
                  </div>
                  <button onClick={() => setIsCorsHelpOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-6 space-y-4 text-xs text-slate-300 leading-relaxed overflow-y-auto max-h-[70vh]">
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <h4 className="font-bold text-white mb-1.5">🪟 Windows 환경변수 설정</h4>
                    <ol className="list-decimal list-inside space-y-1 text-slate-400">
                      <li>작업표시줄 우측 트레이에서 Ollama 아이콘 우클릭 후 <strong>Quit</strong>으로 종료</li>
                      <li><strong>시스템 환경 변수 편집</strong> 실행 → 사용자 변수에 <code className="text-amber-400 font-mono">OLLAMA_ORIGINS</code> 추가 후 값에 <code className="text-emerald-400 font-mono">*</code> 입력</li>
                      <li>Ollama 재실행</li>
                    </ol>
                  </div>

                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <h4 className="font-bold text-white mb-1.5">🍎 Mac / 🐧 Linux 터미널</h4>
                    <div className="bg-slate-900 p-2 rounded border border-slate-800 font-mono text-[11px] text-emerald-400">
                      OLLAMA_ORIGINS="*" ollama serve
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <h4 className="font-bold text-white mb-1.5">🐳 Docker 컨테이너</h4>
                    <div className="bg-slate-900 p-2 rounded border border-slate-800 font-mono text-[11px] text-emerald-400">
                      docker run -d -v ollama:/root/.ollama -p 11434:11434 -e OLLAMA_ORIGINS="*" --name ollama ollama/ollama
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-950/60 border-t border-slate-800 flex justify-between items-center">
                  <button
                    onClick={() => { setIsDownloadModalOpen(true); setIsCorsHelpOpen(false); }}
                    className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold"
                  >
                    💾 HTML 앱 파일 다운로드
                  </button>
                  <button
                    onClick={() => setIsCorsHelpOpen(false)}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>


</body></html>
