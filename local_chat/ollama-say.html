  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const ACADEMIC_WRITING_RULE = `모든 답변은 전문적인 한국어 학술 문체로 작성한다. 서술어는 원칙적으로 '~이다', '~하였다', '~로 판단된다', '~할 수 있다'와 같은 격식 있는 문어체를 사용하며, 반말·구어체·과도한 감탄 표현은 사용하지 않는다.`;

    // Mode Definitions
    const MODES = {
      INSTANT: {
        id: 'instant',

        id: 'reasoning',

        description: '단계별 심층 사고와 논리적 다각도 분석',
        systemPrompt: `당신은 심층 분석과 정밀한 추론을 수행하는 AI 분석가입니다.
답변 시 다음 구조를 따라 철저하게 논리적으로 작성하세요:
1. [핵심 요약 및 결론]
2. [단계별 심층 추론 및 원리 분석 (Step-by-Step)]
3. [고려해야 할 변수, 한계점 및 대안]
4. [최종 권고사항]`
      },
      SEARCH: {
        id: 'search',
        name: '웹 검색',
        color: 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30',
        badgeColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        description: '실시간 웹 검색 결과 및 출처 종합 브리핑',
        systemPrompt: '당신은 웹 검색 결과를 면밀히 대조하여 최신 정보를 종합 브리핑하는 검색 전문가입니다. 제공된 검색 결과 컨텍스트를 바탕으로 사실에 기반하여 신뢰도 높은 답변을 작성하고 참고할 수 있도록 주요 팩트를 정리하세요.'
      },
      ACADEMIC: {
        id: 'academic',
        name: '학술검색',
        color: 'text-blue-400 bg-blue-500/10 border-blue-500/30',
        badgeColor: 'bg-blue-500/20 text-blue-300 border-blue-500/40',
        description: 'Crossref/OpenAlex/arXiv 개별 논문 수집 및 학술 비교분석',
        systemPrompt: `당신은 세계적인 연구 논문과 초록을 비판적으로 종합하는 학술 연구 전문가입니다.
제공된 논문 메타데이터 및 초록(Abstract)들을 바탕으로 다음 3가지 핵심 섹션으로 나누어 전문성 있게 학술 브리핑을 작성하세요:

### 1. 🌐 연구 동향 및 전체 종합 정리
- 검색된 연구들이 다루는 핵심 문제의식과 전반적인 결론을 종합 서술.

### 2. 🤝 지지 및 일치하는 연구 주장 (연구자, 연도 인용 필수)
- 공통되거나 상호 보완적인 입장을 취하는 연구들을 [저자 성(Lastname) et al., 연도] 형식으로 명시하여 어떤 메커니즘/실험으로 주장을 뒷받침하는지 인용 분석.

### 3. ⚖️ 반대 견해, 상충되는 주장 및 연구의 한계 (연구자, 연도 인용 필수)
- 기존 연구와 상반되거나, 다른 방법론/조건에서 상이한 결과를 낸 연구, 혹은 남겨진 과제와 비판점을 [저자 성(Lastname) et al., 연도] 형식으로 비교 대조.`
      }
    };

    // Fetch every provider independently. Results are intentionally not de-duplicated:
    // the same work indexed by multiple databases remains visible with each source label.
    async function fetchAcademicPapers(query, signal, requestedCount = 10) {
      const limit = Math.max(1, Math.min(300, Number(requestedCount) || 10));
      const perSource = Math.ceil(limit / 3);
      const cleanQuery = encodeURIComponent(query.trim());
      const openAlexTask = (async () => {
        const papers = [];
        const openAlexRes = await fetch(`https://api.openalex.org/works?search=${cleanQuery}&per_page=${perSource}&sort=relevance_score:desc`, {
          signal, headers: { 'Accept': 'application/json' }
        });
        if (openAlexRes.ok) {
          const data = await openAlexRes.json();
          (data.results || []).forEach(work => {
            let abstract = '초록 정보 없음';
            if (work.abstract_inverted_index) {
              const words = [];
              Object.entries(work.abstract_inverted_index).forEach(([word, positions]) => {
                positions.forEach(pos => { words[pos] = word; });
              });
              abstract = words.filter(Boolean).join(' ');
            }
            
            const authors = (work.authorships || []).map(a => a.author?.display_name).filter(Boolean);
            const firstAuthor = authors[0] || 'Unknown';
            const year = work.publication_year || 'N/A';
            const authorCitation = authors.length > 1 ? `${firstAuthor} et al.` : firstAuthor;

            papers.push({
              source: 'OpenAlex',
              title: work.title || 'Untitled Research Paper',
              authors: authors.slice(0, 4).join(', ') + (authors.length > 4 ? ' 외' : ''),
              citationKey: `${authorCitation}, ${year}`,
              year: year,
              journal: work.primary_location?.source?.display_name || 'Academic Venue',
              doi: work.doi || (work.ids?.doi ? `https://doi.org/${work.ids.doi}` : null),
              url: work.doi || work.id || `https://scholar.google.com/scholar?q=${cleanQuery}`,
              abstract: abstract.length > 450 ? abstract.slice(0, 450) + '...' : abstract,
              fullAbstract: abstract,
              citedCount: work.cited_by_count || 0
            });
          });
        }
        return papers;
      })();
      const crossrefTask = (async () => {
          const papers = [];
          const crossrefRes = await fetch(`https://api.crossref.org/works?query=${cleanQuery}&rows=${perSource}`, {
            signal, headers: { 'Accept': 'application/json' }
          });
          if (crossrefRes.ok) {
            const data = await crossrefRes.json();
            (data.message?.items || []).forEach(item => {
              const authors = (item.author || []).map(a => `${a.family || ''} ${a.given || ''}`.trim()).filter(Boolean);
              const firstAuthor = item.author?.[0]?.family || 'Unknown';
              const year = item.created?.['date-parts']?.[0]?.[0] || item.issued?.['date-parts']?.[0]?.[0] || 'N/A';
              const title = item.title?.[0] || 'Untitled Work';
              const cleanAbstract = item.abstract ? item.abstract.replace(/<[^>]*>?/gm, '') : '초록 미제공 (Crossref 메타데이터 인용)';

                papers.push({
                  source: 'Crossref',
                  title: title,
                  authors: authors.slice(0, 3).join(', ') + (authors.length > 3 ? ' 외' : ''),
                  citationKey: `${firstAuthor} et al., ${year}`,
                  year: year,
                  journal: item['container-title']?.[0] || 'Crossref Indexed Journal',
                  doi: item.DOI ? `https://doi.org/${item.DOI}` : null,
                  url: item.URL || (item.DOI ? `https://doi.org/${item.DOI}` : '#'),
                  abstract: cleanAbstract.length > 350 ? cleanAbstract.slice(0, 350) + '...' : cleanAbstract,
                  fullAbstract: cleanAbstract,
                  citedCount: item['is-referenced-by-count'] || 0
                });
            });
          }
          return papers;
      })();
      const arxivTask = (async () => {
        const papers = [];
        const localArxivProxy = /^https?:$/.test(location.protocol) && ['127.0.0.1:8767','localhost:8767'].includes(location.host);
        const arxivUrl = localArxivProxy ? `/academic/arxiv?q=${cleanQuery}&count=${perSource}` : `https://export.arxiv.org/api/query?search_query=all:${cleanQuery}&start=0&max_results=${perSource}&sortBy=relevance`;
        const response = await fetch(arxivUrl, {signal, headers:{Accept:'application/atom+xml'}});
        if (!response.ok) return papers;
        const xml = new DOMParser().parseFromString(await response.text(), 'application/xml');
        [...xml.querySelectorAll('entry')].forEach(entry => {
          const text = selector => (entry.querySelector(selector)?.textContent || '').replace(/\s+/g, ' ').trim();
          const authors = [...entry.querySelectorAll('author > name')].map(node => node.textContent.trim()).filter(Boolean);
          const published = text('published');
          const url = text('id');
          const doi = [...entry.querySelectorAll('link')].find(node => node.getAttribute('title') === 'doi')?.getAttribute('href') || null;
          const abstract = text('summary') || '초록 정보 없음';
          const firstAuthor = authors[0] || 'Unknown';
          const year = published ? published.slice(0, 4) : 'N/A';
          papers.push({source:'arXiv', title:text('title') || 'Untitled arXiv Paper', authors:authors.slice(0,4).join(', ') + (authors.length > 4 ? ' 외' : ''), citationKey:`${authors.length > 1 ? firstAuthor + ' et al.' : firstAuthor}, ${year}`, year, journal:'arXiv', doi, url:url || '#', abstract:abstract.length > 450 ? abstract.slice(0,450) + '...' : abstract, fullAbstract:abstract, citedCount:0});
        });
        return papers;
      })();
      const settled = await Promise.allSettled([openAlexTask, crossrefTask, arxivTask]);
      if (signal?.aborted) throw signal.reason || new DOMException('Aborted','AbortError');
      settled.forEach((result,index) => { if (result.status === 'rejected') console.warn(['OpenAlex','Crossref','arXiv'][index]+' fetch note:', result.reason); });
      const groups = settled.map(result => result.status === 'fulfilled' ? result.value : []);
      const combined = [];
      for (let row=0; combined.length < limit && groups.some(group => row < group.length); row++) {
        groups.forEach(group => { if (combined.length < limit && group[row]) combined.push(group[row]); });
      }
      return combined;
    }

    // Web Search Fetcher (Wikipedia API & Live Query Index)
    async function fetchWebKnowledge(query, signal) {
      const results = [];
      const cleanQuery = encodeURIComponent(query.trim());
      try {
        const wikiRes = await fetch(`https://ko.wikipedia.org/w/api.php?action=query&list=search&srsearch=${cleanQuery}&utf8=&format=json&origin=*`, { signal });
        if (wikiRes.ok) {
          const data = await wikiRes.json();
          (data.query?.search || []).slice(0, 3).forEach(item => {
            results.push({
              title: item.title,
              snippet: item.snippet.replace(/<[^>]*>?/gm, ''),
              url: `https://ko.wikipedia.org/wiki/${encodeURIComponent(item.title)}`,
              source: 'Wikipedia Encyclopedia'
            });
          });
        }
      } catch (err) {
        if (signal?.aborted) throw err;
        console.warn('Wiki fetch note:', err);
      }

      if (results.length === 0) {
        results.push({
          title: `"${query}" 웹 검색 인덱스`,
          snippet: `DuckDuckGo 및 오픈 웹 지식 베이스에서 수집된 관련 토픽 인덱스입니다.`,
          url: `https://duckduckgo.com/?q=${cleanQuery}`,
          source: 'DuckDuckGo Web'
        });
      }
      return results;
    }

    // Offline simulation streamer (for testing when Ollama server is offline)
    async function simulateOllamaStream(mode, prompt, academicPapers, webSources, onChunk, signal) {
      let text = '';
      if (mode === 'academic') {
        text = `### 1. 🌐 연구 동향 및 전체 종합 정리
제시해주신 주제("${prompt}")에 대해 수집된 Crossref 및 OpenAlex/arXiv 연구 논문들을 종합한 결과, 초기 이론적 접근에서 실무적 벤치마크 및 고성능 파이프라인 최적화 단계로 연구 패러다임이 빠르게 확장되고 있습니다.

### 2. 🤝 지지 및 일치하는 연구 주장 (연구자, 연도 인용)
- [${academicPapers[0]?.citationKey || 'Vaswani et al., 2017'}]: 주요 메커니즘을 통해 기존 기준선(Baseline) 대비 처리 속도와 일관성을 획기적으로 향상시킬 수 있음을 실증 데이터로 증명했습니다.
- [${academicPapers[1]?.citationKey || 'Brown et al., 2020'}]: 다양한 데이터셋에서의 사전학습 모델 적용이 모델 일반화 성능을 유의미하게 보장함을 보고하였습니다.

### 3. ⚖️ 반대 견해, 상충되는 주장 및 연구의 한계 (연구자, 연도 인용)
- [${academicPapers[2]?.citationKey || 'Smith et al., 2023'}]: 반면, 자원 제한적 환경이나 실시간 저지연 제약 조건에서는 연산 복잡도와 예외 케이스 처리 오차가 커질 수 있음을 지적하며 가벼운 경량화 모델 및 검증 프레임워크 구축을 대안으로 제시하고 있습니다.`;
      } else if (mode === 'reasoning') {
        text = `1. [핵심 요약 및 결론]
질문하신 "${prompt}"에 대한 다단계 추론 결과, 단일 방식보다는 계층형 구조와 단계별 검증 방식을 채택하는 것이 가장 효율적입니다.

2. [단계별 심층 추론 및 원리 분석 (Step-by-Step)]
- **1단계: 요구사항 분해 및 제약 조건 파악** → 입력 매개변수와 데이터 의존성 식별
- **2단계: 최적화 경로 탐색** → 잠재적 병목 구간 제거 및 비동기 파이프라인 구성
- **3단계: 예외 상황 방어** → 네트워크 지연 및 입력값 이상치 필터링

3. [고려해야 할 변수, 한계점 및 대안]
- 시스템 부하율과 로컬 GPU 메모리(VRAM) 한계
- 대안: 양자화(Quantization) 모델(4-bit/8-bit) 적용 및 인메모리 캐싱

4. [최종 권고사항]
소규모 샘플 테스트를 우선 거친 뒤 점진적으로 워크플로우를 확장하시기 바랍니다.`;
      } else if (mode === 'search') {
        text = `웹 검색 결과를 종합하여 안내해 드립니다:

"${prompt}"에 대해 수집된 최신 웹 정보 및 기술 자료를 분석한 결과입니다.

- **핵심 정보**: 관련 주요 기술 사양과 가이드라인이 최근 릴리즈되어 상호 연동성이 한층 강화되었습니다.
- **활용 방안**: 위 첨부된 출처 카드의 링크를 통해 상세 레퍼런스 문서를 즉시 열람하실 수 있습니다.`;
      } else {
        text = `안녕하세요! AI 어시스턴트 **Ollama Say**입니다.\n\n질문하신 "${prompt}"에 대한 답변입니다:\n로컬 및 원격 LLM을 통해 요청 사항을 빠르고 정확하게 분석했습니다. 추가 분석이 필요하시면 [추론], [웹 검색], [학술검색] 모드를 활용해 보세요!`;
      }

      const words = text.split(' ');
      for (let i = 0; i < words.length; i++) {
        if (signal?.aborted) throw new DOMException('Stopped', 'AbortError');
        onChunk((i === 0 ? '' : ' ') + words[i]);
        await new Promise(r => setTimeout(r, 20));
      }
    }


    const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    // Inline tokens protect math before Markdown interprets backslashes and underscores.
    marked.use({extensions: [
      {name:'mathBlock',level:'block',start:s=>s.indexOf('$$'),tokenizer(s){
        const m=/^\$\$([\s\S]+?)\$\$(?:\n|$)/.exec(s);
        if(m)return {type:'mathBlock',raw:m[0],text:m[1]};
      },renderer:t=>katex.renderToString(t.text,{displayMode:true,throwOnError:false,trust:false})},
      {name:'mathInline',level:'inline',start:s=>s.search(/\$|\\[([]/),tokenizer(s){
        const m=/^(?:\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$)/.exec(s);
        if(m)return {type:'mathInline',raw:m[0],text:m[1]||m[2]||m[3]||m[4],display:!!(m[1]||m[2])};
      },renderer:t=>katex.renderToString(t.text,{displayMode:t.display,throwOnError:false,trust:false})},

          if(label==='Bold')text='**'+selected+'**';
          else if(label==='기울기')text='*'+selected+'*';
          else if(['H1','H2','H3','항목','숫자항목'].includes(label))text=selected.split('\n').map((line,i)=>(label==='항목'?'- ':label==='숫자항목'?(i+1)+'. ':'#'.repeat(Number(label[1]))+' ')+line).join('\n');
          else if(label==='코드'||label==='Mermaid')text='\n'+FENCE+(label==='Mermaid'?'mermaid':'')+'\n'+selected+'\n'+FENCE+'\n';
          else if(label==='수식')text='\n$$\n'+selected+'\n$$\n';
        }
        insertRef.current(text);
      };
      const capture=e=>{selection.current=[e.target.selectionStart,e.target.selectionEnd];};
      return <section id="document-workspace" aria-label="문서 작업실" className="editor-panel" style={{display:isOpen?undefined:'none'}}>
        <div className="editor-toolbar"><strong>문서 작업실</strong><span className="save-status" role="status">{status}</span><button type="button" onClick={onClose} aria-label="문서 작업실 닫기">닫기 ✕</button></div>
        <div className="document-list">
          <div className="editor-toolbar"><strong>문서 목록 ({documents.length})</strong><input aria-label="문서 검색" placeholder="문서 검색" value={filter} onChange={e=>setFilter(e.target.value)}/><button disabled={!ready||busy} onClick={()=>switchDoc({id:crypto.randomUUID(),title:'새 문서',text:''})}>＋ 새 문서</button></div>
          <div className="document-list-items">{documents.filter(d=>d.title.toLowerCase().includes(filter.toLowerCase())).map(d=><button key={d.id} disabled={busy} aria-current={doc.id===d.id?'page':undefined} onClick={()=>switchDoc(d)}><span>{d.title||'제목 없음'}</span><small>{d.text.length.toLocaleString()}자</small></button>)}</div>
        </div>
        <div className="editor-toolbar"><input aria-label="문서 제목" disabled={!ready||busy} value={doc.title} onChange={e=>change({...doc,title:e.target.value})}/>
          <button disabled={!ready||busy} onClick={()=>persist(live.current).catch(()=>{})}>저장</button>
          <button disabled={!ready||busy} onClick={saveAll}>전체 저장 (백업)</button>
          <button disabled={!ready||busy} onClick={()=>backup.current.click()}>전체 복원</button><input ref={backup} type="file" accept=".json" hidden onChange={restoreAll}/>
          <button onClick={()=>downloadFile((doc.title||'문서').replace(/[\\/:*?"<>|]/g,'_')+'.md',doc.text)}>MD 내보내기</button>
          <button disabled={!ready||busy} onClick={()=>file.current.click()}>불러오기</button>
          <input ref={file} type="file" accept=".md,.markdown,.txt" hidden onChange={async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await switchDoc({id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),text:await f.text()});}catch(err){notify(err.message);}}}/>
          <button disabled={!ready||busy} onClick={()=>{setPushPath('documents/'+doc.id+'.md');setCommitMessage('Update '+doc.title);setPushOpen(true);}}>GitHub 커밋·푸시</button>
        </div>
        {pushOpen&&<div className="github-push">
          <strong>현재 문서를 GitHub에 저장</strong><p>{github.repo||'설정에서 GitHub 저장소와 토큰을 입력하세요.'} · {github.branch||'기본 브랜치'}</p>
          <label>파일 경로<input aria-label="GitHub 파일 경로" value={pushPath} onChange={e=>setPushPath(e.target.value)}/></label>
          <label>커밋 메시지<input aria-label="커밋 메시지" value={commitMessage} onChange={e=>setCommitMessage(e.target.value)}/></label>
          <button disabled={busy||!github.token} onClick={async()=>{setBusy(true);setCommitUrl('');try{const snapshot={...live.current};await persist(snapshot);const result=await commitGitHubDocument({...github},snapshot,pushPath,commitMessage);if(result){setCommitUrl(result.commit.html_url);notify('커밋·푸시 완료: '+result.commit.sha.slice(0,7));}}catch(e){notify(e.message);}finally{setBusy(false);}}}>{busy?'저장 중…':'커밋·푸시 실행'}</button>
          <button disabled={busy} onClick={()=>setPushOpen(false)}>닫기</button>{commitUrl&&<a href={commitUrl} target="_blank" rel="noreferrer">커밋 확인 ↗</a>}
        </div>}
        <div className="editor-toolbar">
          {['md','split','pv'].map(v=><button key={v} aria-pressed={view===v} onClick={()=>setView(v)}>{v==='split'?'MD + PV':v.toUpperCase()}</button>)}
          <button onClick={()=>undo(false)} title="Ctrl+Z">↶</button><button onClick={()=>undo(true)} title="Ctrl+Y">↷</button>
          <button onClick={()=>{try{openDocumentWindow(doc.text);}catch(e){notify(e.message);}}}>새창</button>
        </div>
        <div className="editor-toolbar insert-toolbar" aria-label="Markdown 삽입 도구">{INSERT_TOOLS.map(([label,sample])=><button key={label} disabled={!ready||busy} onMouseDown={e=>e.preventDefault()} onClick={()=>insertTool(label,sample)}>{label}</button>)}</div>
        <div className={'editor-panes '+view}>
          {view!=='pv'&&<div className="source-editor">
            <pre ref={highlight} aria-hidden="true" dangerouslySetInnerHTML={{__html:sourceHighlight(doc.text)}}/>
            <textarea aria-label="Markdown 편집기" ref={editor} disabled={!ready||busy} spellCheck={false} value={doc.text} placeholder="Markdown을 입력하거나 AI 답변을 삽입하세요."
            onSelect={capture} onClick={capture} onKeyUp={capture} onBlur={capture}
            onScroll={e=>{if(highlight.current){highlight.current.scrollTop=e.target.scrollTop;highlight.current.scrollLeft=e.target.scrollLeft;}}}
            onChange={e=>change({...doc,text:e.target.value})}
            onKeyDown={e=>{if((e.ctrlKey||e.metaKey)&&!e.nativeEvent.isComposing&&['z','y','s'].includes(e.key.toLowerCase())){e.preventDefault();if(e.key.toLowerCase()==='s')persist(live.current).catch(()=>{});else undo(e.key.toLowerCase()==='y'||e.shiftKey);}}}/>
          </div>}
          {view!=='md'&&<div className="editor-preview"><Markdown text={doc.text} theme={theme}/></div>}
        </div>
      </section>;
    }

    function App() {
      const insertRef=useRef(null);
      const [isWorkspaceOpen,setIsWorkspaceOpen]=useState(false);
      const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('ollama-say-theme')||'dark';}catch{return 'dark';}});
      useEffect(()=>{document.documentElement.classList.toggle('dark',theme==='dark');document.documentElement.classList.toggle('light',theme==='light');try{localStorage.setItem('ollama-say-theme',theme);}catch{}},[theme]);
      const [github,setGithub]=useState(loadGitHubConfig),[githubStatus,setGithubStatus]=useState('연결 전'),[githubChecking,setGithubChecking]=useState(false);
      const updateGithub=(key,value)=>{setGithub(prev=>{const next={...prev,[key]:value};try{localStorage.setItem('ollama-say-github',JSON.stringify({repo:next.repo,branch:next.branch}));}catch{}return next;});setGithubStatus('연결 전');};
      const [showThinking,setShowThinking]=useState(false),[sourceViews,setSourceViews]=useState({});
      const [systemPrompt,setSystemPrompt]=useState(()=>{try{return localStorage.getItem('ollama-say-system-prompt')||'';}catch{return '';}});
      const updateSystemPrompt=value=>{setSystemPrompt(value);try{localStorage.setItem('ollama-say-system-prompt',value);}catch{showToast('설정을 저장할 수 없습니다.');}};
      // Server Connection States
      const [endpointType, setEndpointType] = useState('local'); // 'local' | 'online'
      const managerEndpoint = window.location.origin + '/ollama';
      const [localUrl, setLocalUrl] = useState(managerEndpoint);
      const [onlineUrl, setOnlineUrl] = useState('');
      const [activeUrl, setActiveUrl] = useState(managerEndpoint);

      // Model & Status States
      const [models, setModels] = useState([]);
      const [selectedModel, setSelectedModel] = useState('');
      const [customModelInput, setCustomModelInput] = useState('llama3');
      const [isLoadingModels, setIsLoadingModels] = useState(false);
      const [connectionStatus, setConnectionStatus] = useState('idle'); // 'connected' | 'error' | 'idle' | 'demo'
      const [errorMessage, setErrorMessage] = useState('');
      const [isDemoMode, setIsDemoMode] = useState(false);

      // Chat & Mode States
      const [activeMode, setActiveMode] = useState('instant');
      const [academicCount, setAcademicCount] = useState(()=>{try{const value=Number(localStorage.getItem('ollama-say-academic-count'));return value>=1&&value<=300?String(value):'10';}catch{return '10';}});
      const updateAcademicCount = value => {
        const normalized=String(Math.max(1,Math.min(300,Number(value)||10)));
        setAcademicCount(normalized);
        try{localStorage.setItem('ollama-say-academic-count',normalized);}catch{}
      };
      const [sessions, setSessions] = useState([
        { id: '1', title: '새 대화', messages: [], createdAt: new Date().toISOString() }
      ]);
      const [currentSessionId, setCurrentSessionId] = useState('1');
      const [inputText, setInputText] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [activeResponseId, setActiveResponseId] = useState(null);
      const [searchStatus, setSearchStatus] = useState(null);
      const [notification, setNotification] = useState(null);
      const [showDeveloperLogs,setShowDeveloperLogs]=useState(()=>{try{return localStorage.getItem('ollama-say-developer-logs')!=='off';}catch{return true;}}),[developerLogs,setDeveloperLogs]=useState([]);
      const developerLogsEndRef=useRef(null);
      const updateDeveloperLogsVisibility=value=>{setShowDeveloperLogs(value);try{localStorage.setItem('ollama-say-developer-logs',value?'on':'off');}catch{}};
      const addDeveloperLog=(level,message,detail='')=>{
        const normalized=['debug','info','warn','error'].includes(level)?level:'info';
        const row={id:crypto.randomUUID(),time:new Date().toLocaleTimeString('ko-KR',{hour12:false}),level:normalized,message:String(message),detail:detail?String(detail):''};
        setDeveloperLogs(prev=>[...prev.slice(-499),row]);
        const method=normalized==='debug'?'debug':normalized==='warn'?'warn':normalized==='error'?'error':'info';
        console[method](`[Ollama Say] [${normalized.toUpperCase()}] ${row.message}`,row.detail||'');
      };
      useEffect(()=>{if(showDeveloperLogs)developerLogsEndRef.current?.scrollIntoView({block:'end'});},[developerLogs,showDeveloperLogs]);
      const [chatReady,setChatReady] = useState(false);
      const [chatStorageStatus,setChatStorageStatus] = useState('대화 불러오는 중…');
      const chatDBRef=useRef(null),chatSaveTimer=useRef(null),chatSaveVersion=useRef(0);
      const chatSnapshotRef=useRef(null);
      chatSnapshotRef.current={version:1,sessions,currentSessionId,activeMode,inputText};
      const flushChatSave=()=>{
        clearTimeout(chatSaveTimer.current);chatSaveTimer.current=null;
        const db=chatDBRef.current;
        if(!db)return;
        const version=++chatSaveVersion.current;
        setChatStorageStatus('대화 저장 중…');
        chatDBTransaction(db,chatSnapshotRef.current).then(()=>{
          if(version===chatSaveVersion.current)setChatStorageStatus('대화 자동 저장됨');
        }).catch(()=>{if(version===chatSaveVersion.current)setChatStorageStatus('대화 저장 실패 · 저장 공간/브라우저 설정을 확인하세요');});
      };
      useEffect(()=>{
        let cancelled=false,opened;
        openChatDB().then(async db=>{
          opened=db;
          const saved=restoreChatSnapshot(await chatDBTransaction(db));
          if(cancelled){db.close();return;}
          if(saved){
            setSessions(saved.sessions);setCurrentSessionId(saved.currentSessionId);
            if(['instant','reasoning','academic','search'].includes(saved.activeMode))setActiveMode(saved.activeMode);
            if(typeof saved.inputText==='string')setInputText(saved.inputText);
          }
          chatDBRef.current=db;
          db.onversionchange=()=>{db.close();chatDBRef.current=null;setChatStorageStatus('저장소가 변경되었습니다 · 새로고침 필요');};
          setChatReady(true);setChatStorageStatus('대화 자동 저장 준비됨');
        }).catch(()=>{
          opened?.close();
          if(!cancelled){setChatReady(true);setChatStorageStatus('대화 복원 실패 · 자동 저장 안 됨 (기존 데이터 유지)');}
        });
        const saveWhenHidden=()=>{if(document.visibilityState==='hidden')flushChatSave();};
        window.addEventListener('pagehide',flushChatSave);
        document.addEventListener('visibilitychange',saveWhenHidden);
        return()=>{
          cancelled=true;flushChatSave();chatDBRef.current=null;opened?.close();
          window.removeEventListener('pagehide',flushChatSave);
          document.removeEventListener('visibilitychange',saveWhenHidden);
        };
      },[]);
      useEffect(()=>{
        if(!chatReady||!chatDBRef.current)return;
        setChatStorageStatus('대화 저장 중…');
        // Throttle stream/draft writes without postponing them indefinitely.
        if(!isGenerating){flushChatSave();return;}
        if(chatSaveTimer.current===null)chatSaveTimer.current=setTimeout(flushChatSave,300);
      },[chatReady,sessions,currentSessionId,activeMode,inputText,isGenerating]);

      // UI Modal States
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isCorsHelpOpen, setIsCorsHelpOpen] = useState(false);
      const [isDownloadModalOpen, setIsDownloadModalOpen] = useState(false);
      const [copiedIndex, setCopiedIndex] = useState(null);
      const [generationSettings, setGenerationSettings] = useState(loadGenerationSettings);
      const temperature = generationSettings.temperature;
      const updateGenerationSetting = (key,value) => setGenerationSettings(prev=>({...prev,[key]:value}));
      const [generationError,setGenerationError] = useState('');

      const messagesScrollRef = useRef(null);
      const followMessagesRef = useRef(true);
      const abortControllerRef = useRef(null);

      const showToast = (msg, type = 'info') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      const copyToClipboard = async (text) => {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            showToast('클립보드에 복사되었습니다.', 'success');
            return;
          }
          const textArea = document.createElement("textarea");
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          if (!document.execCommand('copy')) throw Error('복사 실패');
          document.body.removeChild(textArea);
          showToast('클립보드에 복사되었습니다.', 'success');
        } catch (err) {
          showToast('복사에 실패했습니다.', 'error');
        }
      };

      // Direct download of this standalone HTML file
      const handleDownloadSelf = () => {
        try {
          const clean=document.documentElement.cloneNode(true);
          clean.querySelector('#root').replaceChildren();
          clean.querySelectorAll('script:not([src]):not([type="text/babel"])').forEach(el=>{if(!el.textContent.includes('tailwind.config'))el.remove();});
          const htmlContent = "<!DOCTYPE html>\n" + clean.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'ollama-say.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('ollama-say.html 다운로드가 완료되었습니다!', 'success');
          setIsDownloadModalOpen(false);
        } catch (e) {
          showToast('다운로드 중 오류가 발생했습니다.', 'error');
        }
      };

      useEffect(() => {
        if (isDemoMode) {
          setConnectionStatus('demo');
          setModels(['demo-llama3', 'demo-deepseek-r1', 'demo-qwen2.5', 'demo-gemma2']);
          setSelectedModel('demo-llama3');
          return;
        }

        const url = endpointType === 'local' ? localUrl : onlineUrl;
        setActiveUrl(url);
        if (url) {
          fetchModelList(url);
        }
      }, [endpointType, localUrl, onlineUrl, isDemoMode]);

      const fetchModelList = async (targetUrl) => {
        if (!targetUrl || isDemoMode) return;
        setIsLoadingModels(true);
        setConnectionStatus('idle');
        setErrorMessage('');

        try {
          const sanitized = targetUrl.replace(/\/+$/, '');
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 20000);

          const res = await fetch(`${sanitized}/api/tags`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!res.ok) { const detail=await res.json().catch(()=>({})); throw new Error(detail.error || `HTTP ${res.status}`); }
          const data = await res.json();
          const modelList = (data.models || []).map(m => m.name);

          if (modelList.length > 0) {
            setModels(modelList);
            setConnectionStatus('connected');
            if (!selectedModel || !modelList.includes(selectedModel)) {
              setSelectedModel(modelList.includes(data.default_model) ? data.default_model : modelList[0]);
            }
          } else {
            setModels([]);
            setSelectedModel('');
            setConnectionStatus('connected');
            setCustomModelInput('llama3');
          }
        } catch (err) {
          setModels([]);
          setSelectedModel('');
          setConnectionStatus('error');
          const isHttps = window.location.protocol === 'https:';
          setErrorMessage(
            isHttps && targetUrl.startsWith('http://127.0.0.1')
              ? '브라우저 보안(HTTPS에서 로컬 HTTP 차단) 또는 CORS 정책에 의해 차단되었습니다. 로컬 실행 서버 또는 Ollama의 CORS 허용 설정을 확인하세요.'
              : `Ollama 연결 실패: ${err.message}. 서버 실행 및 연결 주소를 확인하세요.`
          );
        } finally {
          setIsLoadingModels(false);
        }
      };

      const currentSession = sessions.find(s => s.id === currentSessionId) || sessions[0];

      useEffect(() => { followMessagesRef.current = true; }, [currentSessionId]);
      useEffect(() => {
        // Scroll only the message pane; scrollIntoView also scrolls its ancestors.
        if (!followMessagesRef.current) return;
        const frame = requestAnimationFrame(() => {
          const pane = messagesScrollRef.current;
          if (pane && followMessagesRef.current) pane.scrollTop = pane.scrollHeight;
        });
        return () => cancelAnimationFrame(frame);
      }, [currentSessionId, currentSession?.messages, isGenerating, searchStatus, showThinking, sourceViews]);

      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        if (!chatReady || !inputText.trim() || isGenerating || abortControllerRef.current) return;

        let generationRequest;
        try{generationRequest=buildGenerationSettings(generationSettings,selectedModel||customModelInput.trim()||'llama3',activeMode);}
        catch(err){showToast(err.message,'error');return;}

        const userPrompt = inputText.trim();
        followMessagesRef.current = true;
        setInputText('');

        const targetModel = selectedModel || customModelInput.trim() || 'llama3';
        const generationStartedAt=Date.now();
        let receivedEvents=0,receivedCharacters=0,completionLogged=false;
        if(typeof addDeveloperLog==='function')addDeveloperLog('info','생성 요청 시작',`model=${targetModel} · mode=${activeMode}`);
        const currentModeConfig = MODES[activeMode.toUpperCase()];
        
        const userMsg = {
          id: crypto.randomUUID(),
          role: 'user',
          content: userPrompt,
          mode: activeMode,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        let updatedSessions = [...sessions];
        const sIndex = updatedSessions.findIndex(s => s.id === currentSessionId);
        if (sIndex !== -1 && updatedSessions[sIndex].messages.length === 0) {
          updatedSessions[sIndex].title = userPrompt.slice(0, 22) + (userPrompt.length > 22 ? '...' : '');
        }

        updatedSessions[sIndex].messages.push(userMsg);
        setSessions(updatedSessions);
        setIsGenerating(true);

        let academicData = null;
        let webData = null;
        let promptAugmentation = '';

        const controller = new AbortController();
        abortControllerRef.current = controller;
        try {
        // Mode Data Gathering
        if (activeMode === 'academic') {
          const requestedAcademicCount = typeof academicCount === 'undefined' ? 10 : academicCount;
          setSearchStatus(`Crossref / OpenAlex / arXiv에서 최대 ${requestedAcademicCount}건 수집 중...`);
          academicData = await fetchAcademicPapers(userPrompt, controller.signal, requestedAcademicCount);
          controller.signal.throwIfAborted();
          setSearchStatus('논문 초록 다각도 비교 분석 중...');

          if (academicData && academicData.length > 0) {
            promptAugmentation = `\n\n[실제 학술 논문 및 초록 메타데이터]\n` + academicData.map((p, idx) => `
논문 ${idx + 1}:
- 제목: ${p.title}
- 저자: ${p.authors} (인용키: [${p.citationKey}])
- 발행연도: ${p.year}
- 저널/출처: ${p.journal}
- 검색 데이터베이스: ${p.source}
- DOI/링크: ${p.doi || p.url}
- 피인용: ${p.citedCount}회
- 초록(Abstract):
"""
${p.fullAbstract}
"""
`).join('\n');
          }
        } else if (activeMode === 'search') {
          setSearchStatus('실시간 웹 지식 인덱스 탐색 중...');
          webData = await fetchWebKnowledge(userPrompt, controller.signal);
          controller.signal.throwIfAborted();
          setSearchStatus('검색 데이터 취합 및 브리핑 작성 중...');

          if (webData && webData.length > 0) {
            promptAugmentation = `\n\n[검색된 웹 지식 요약]\n` + webData.map((w, idx) => `
출처 ${idx + 1}: ${w.title} (${w.source})
URL: ${w.url}
내용: ${w.snippet}
`).join('\n');
          }
        }

        // Add Assistant Placeholder
        const assistantMsg = {
          id: crypto.randomUUID(),
          role: 'assistant',
          content: '',
          mode: activeMode,
          model: isDemoMode ? `${targetModel} (시뮬레이터)` : targetModel,
          academicPapers: academicData,
          webSources: webData,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setActiveResponseId(assistantMsg.id);
        updatedSessions[sIndex].messages.push(assistantMsg);
        setSessions([...updatedSessions]);

        controller.signal.throwIfAborted();

        // Fallback or Demo Mode
        if (isDemoMode || connectionStatus === 'error') {
          try {
            let accumulated = '';
            await simulateOllamaStream(
              activeMode,
              userPrompt,
              academicData || [],
              webData || [],
              (chunk) => {
                accumulated += chunk;
                receivedEvents += 1;receivedCharacters += chunk.length;
                if(typeof addDeveloperLog==='function')addDeveloperLog('debug',`시뮬레이션 토큰 #${receivedEvents}`,`${JSON.stringify(chunk)} · 누적 ${receivedCharacters}자`);
                setSessions(prev => {
                  const copy = [...prev];
                  const curIdx = copy.findIndex(s => s.id === currentSessionId);
                  if (curIdx !== -1 && copy[curIdx].messages.length > 0) {
                    const lIdx = copy[curIdx].messages.length - 1;
                    copy[curIdx].messages[lIdx].content = accumulated;
                  }
                  return copy;
                });
              },
              controller.signal
            );
            completionLogged=true;
            if(typeof addDeveloperLog==='function')addDeveloperLog('info','시뮬레이션 응답 완료',`${receivedEvents}개 이벤트 · ${receivedCharacters}자 · ${((Date.now()-generationStartedAt)/1000).toFixed(2)}초`);
          } catch (err) {
            if(typeof addDeveloperLog==='function')addDeveloperLog(controller.signal.aborted?'warn':'error',controller.signal.aborted?'응답 생성 중단':'시뮬레이션 오류',err.message||'Stream ended.');
          }
          return;
        }

        // Live Ollama API Stream Call
          const sanitizedUrl = activeUrl.replace(/\/+$/, '');
          const contextMessages = [
            { role: 'system', content: `${systemPrompt.trim() || currentModeConfig.systemPrompt}\n\n[기본 응답 문체]\n모든 답변은 전문적인 한국어 학술 문체로 작성한다. 서술어는 원칙적으로 '~이다', '~하였다', '~로 판단된다', '~할 수 있다'와 같은 격식 있는 문어체를 사용하며, 반말·구어체·과도한 감탄 표현은 사용하지 않는다.` }
          ];

          const pastMessages = updatedSessions[sIndex].messages.slice(0, -2);
          pastMessages.slice(-6).forEach(m => {
            contextMessages.push({ role: m.role, content: m.content });
          });

          contextMessages.push({
            role: 'user',
            content: `${userPrompt}${promptAugmentation}`
          });

          const response = await fetch(`${sanitizedUrl}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: targetModel,
              messages: contextMessages,
              ...generationRequest,
              stream: true
            }),
            signal: controller.signal
          });

          if (!response.ok) {
            throw new Error(`Ollama 서버 응답 에러 (HTTP ${response.status})`);
          }
          if(typeof addDeveloperLog==='function')addDeveloperLog('info','Ollama 스트림 연결됨',`HTTP ${response.status||200} · ${sanitizedUrl}/api/chat`);

          setSearchStatus(null);
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let accumulatedText = '',accumulatedThinking='';
          let pending = '';
          while (true) {
            const { done, value } = await reader.read();
            controller.signal.throwIfAborted();
            pending += decoder.decode(value, { stream: !done });
            const lines = pending.split('\n');
            pending = done ? '' : lines.pop();
            for (const line of lines) {
              if(!line.trim())continue;
              let parsed;try{parsed=JSON.parse(line);}catch{throw Error('Ollama 스트림 JSON 형식 오류');}
              if(parsed.error)throw Error(parsed.error);
              if(parsed.message?.content || parsed.message?.thinking){
                receivedEvents += 1;
                const tokenText=(parsed.message.content||'')+(parsed.message.thinking||'');
                receivedCharacters += tokenText.length;
                if(typeof addDeveloperLog==='function')addDeveloperLog('debug',`토큰 이벤트 #${receivedEvents}`,`${JSON.stringify(tokenText)} · 누적 ${receivedCharacters}자`);
                accumulatedText += parsed.message.content||'';
                accumulatedThinking += parsed.message.thinking||'';
                const content=accumulatedText,thinking=accumulatedThinking;
                setSessions(prev=>prev.map(session=>session.id!==currentSessionId?session:{...session,messages:session.messages.map(message=>message.id===assistantMsg.id?{...message,content,thinking}:message)}));
              }
              if(parsed.done){
                completionLogged=true;
                const elapsed=((Date.now()-generationStartedAt)/1000).toFixed(2);
                const evalCount=parsed.eval_count==null?receivedEvents:parsed.eval_count;
                const rate=parsed.eval_duration&&parsed.eval_count?(parsed.eval_count/(parsed.eval_duration/1e9)).toFixed(2):'측정 불가';
                if(typeof addDeveloperLog==='function')addDeveloperLog('info','응답 완료',`생성 토큰 ${evalCount} · 프롬프트 토큰 ${parsed.prompt_eval_count??'미제공'} · ${rate} token/s · ${elapsed}초`);
              }
            }
            if(done)break;
          }
        } catch (err) {
          if (!controller.signal.aborted && err.name !== 'AbortError') {
            if(typeof addDeveloperLog==='function')addDeveloperLog('error','응답 생성 실패',err.message);
            setSessions(prev => {
              const copy = [...prev];
              const curIdx = copy.findIndex(s => s.id === currentSessionId);
              if (curIdx !== -1 && copy[curIdx].messages.length > 0) {
                const lIdx = copy[curIdx].messages.length - 1;
                copy[curIdx].messages[lIdx].content += '\n\n⚠️ '+err.message+'\n추론 미지원 모델이면 즉시 모드로 전환하거나 추론 지원 모델을 선택하세요.';
                copy[curIdx].messages[lIdx].isError = true;
              }
              return copy;
            });
          }
        } finally {
          if(controller.signal.aborted&&typeof addDeveloperLog==='function')addDeveloperLog('warn','응답 생성 중단',`${receivedEvents}개 이벤트 · ${receivedCharacters}자 유지`);
          else if(!completionLogged&&receivedEvents&&typeof addDeveloperLog==='function')addDeveloperLog('info','스트림 종료',`${receivedEvents}개 이벤트 · ${receivedCharacters}자 · 완료 통계 미제공`);
          if (abortControllerRef.current === controller) {
            setActiveResponseId(null);
            setIsGenerating(false);
            setSearchStatus(null);
            abortControllerRef.current = null;
          }
        }
      };

      const handleStop = () => {
        if (abortControllerRef.current) {
          abortControllerRef.current.abort();
          setSearchStatus('답변 중지 중…');
          showToast('답변을 중지했습니다. 지금까지 받은 내용은 유지됩니다.');
        }
      };

      const handleNewChat = () => {
        if(!chatReady)return;
        const newId = crypto.randomUUID();
        const newSession = {
          id: newId,
          title: '새 대화',
          messages: [],
          createdAt: new Date().toISOString()
        };
        setSessions([newSession, ...sessions]);
        setCurrentSessionId(newId);
      };

      const handleDeleteChat = (id, e) => {
        e.stopPropagation();
        if(!chatReady)return;
        if (sessions.length === 1) {
          const newId=crypto.randomUUID();
          setSessions([{ id: newId, title: '새 대화', messages: [], createdAt: new Date().toISOString() }]);
          setCurrentSessionId(newId);
          return;
        }
        const filtered = sessions.filter(s => s.id !== id);
        setSessions(filtered);
        if (currentSessionId === id) {
          setCurrentSessionId(filtered[0].id);
        }
      };

      return (
        <div className="chat-shell flex h-screen w-full bg-slate-950 text-slate-100 font-sans overflow-hidden">
          {!chatReady&&<div className="fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center text-sm" role="status">대화 불러오는 중…</div>}
          {/* Toast Notification */}
          {notification && (
            <div className="fixed top-4 right-4 z-50 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white shadow-2xl animate-fade-in">
              <span className="text-indigo-400">●</span>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className={`fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 border-r border-slate-800 transition-transform duration-300 flex flex-col ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0`}>
            {/* Header Brand */}
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/20 text-lg">
                  🤖
                </div>
                <div>
                  <h1 className="font-bold text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    Ollama Say
                  </h1>
                  <p className="text-[11px] text-slate-400 font-medium">Local & Online AI Chat</p>
                </div>
              </div>
              <div className="flex items-center gap-1">
              <button type="button" className="theme-toggle" onClick={()=>setTheme(value=>value==='dark'?'light':'dark')} title={theme==='dark'?'라이트 모드로 전환':'다크 모드로 전환'} aria-label={theme==='dark'?'라이트 모드로 전환':'다크 모드로 전환'}>{theme==='dark'?'☀️':'🌙'}</button>
              <button 
                onClick={handleNewChat}
                className="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors text-lg"
                title="새 채팅 시작"
              >
                ＋
              </button>
              </div>
            </div>

            {/* Server Connection Status Banner */}
            <div className="p-3 mx-3 mt-3 rounded-xl bg-slate-950/70 border border-slate-800">
              <div className="flex items-center justify-between text-xs mb-1.5">
                <span className="text-slate-400 font-medium flex items-center gap-1.5">
                  🖥️ {isDemoMode ? '시뮬레이터' : endpointType === 'local' ? '로컬 서버' : '원격 서버'}
                  {!isDemoMode && (
                    <button
                      type="button"
                      onClick={() => fetchModelList(endpointType === 'local' ? localUrl : onlineUrl)}
                      disabled={isLoadingModels || !(endpointType === 'local' ? localUrl : onlineUrl)}
                      className="px-2 py-1 rounded-md bg-indigo-600 text-white text-[10px] font-semibold hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                      title="서버에 다시 연결하고 모델 목록 새로고침"
                    >
                      {isLoadingModels ? '연결 중…' : '연결'}
                    </button>
                  )}
                </span>
                <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                  isDemoMode ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' :
                  connectionStatus === 'connected' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                  connectionStatus === 'error' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                  'bg-amber-500/20 text-amber-400'
                }`}>
                  <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${
                    isDemoMode ? 'bg-indigo-400' :
                    connectionStatus === 'connected' ? 'bg-emerald-400 animate-ping' :
                    connectionStatus === 'error' ? 'bg-rose-400' : 'bg-amber-400'
                  }`} />
                  {isDemoMode ? '체험 모드' : connectionStatus === 'connected' ? '연결됨' : connectionStatus === 'error' ? '연결 필요' : '확인 중'}
                </span>
              </div>
              <p className="text-[11px] text-slate-400 truncate font-mono bg-slate-900 px-2 py-1 rounded border border-slate-800/80">
                {isDemoMode ? 'Demo Simulator (Web)' : activeUrl || '(URL 미지정)'}
              </p>
            </div>


            {/* Chat History List */}
            <div className="flex-1 overflow-y-auto px-3 py-3 space-y-1">
              <div className="px-2 py-1 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                대화 목록 ({sessions.length})
              </div>
              <p role="status" className="px-2 pb-2 text-[10px] text-slate-400">{chatStorageStatus}</p>
              {sessions.map(s => (
                <div
                  key={s.id}
                  onClick={() => {if(chatReady)setCurrentSessionId(s.id);}}
                  className={`group flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-all ${
                    s.id === currentSessionId 
                      ? 'bg-gradient-to-r from-indigo-950/60 to-purple-950/40 text-indigo-200 border border-indigo-500/30' 
                      : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <div className="flex items-center space-x-2 overflow-hidden">
                    <span className="text-xs">💬</span>
                    <span className="text-xs truncate font-medium">{s.title}</span>
                  </div>
                  <button
                    onClick={(e) => handleDeleteChat(s.id, e)}
                    className="opacity-0 group-hover:opacity-100 p-1 hover:text-rose-400 transition-opacity text-xs"
                    title="대화 삭제"
                  >
                    ✕
                  </button>
                </div>
              ))}
            </div>

            {/* Bottom Actions */}
            <div className="p-3 border-t border-slate-800 bg-slate-900/60 space-y-1.5">
              <button
                onClick={() => setIsSettingsOpen(true)}
                className="w-full flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-800 text-xs font-medium text-slate-300 transition-colors"
              >
                <div className="flex items-center gap-2">
                  <span>⚙️</span>
                  <span>연결 및 모델 환경설정</span>
                </div>
                <span className="text-slate-500 text-xs">›</span>
              </button>
              
              <button
                onClick={() => setIsCorsHelpOpen(true)}
                className="w-full flex items-center gap-2 p-2 rounded-lg hover:bg-slate-800/80 text-[11px] text-indigo-300 transition-colors"
              >
                <span>❓</span>
                <span>로컬 Ollama 연결 & 실행 가이드</span>
              </button>
            </div>
          </aside>

          {!isWorkspaceOpen&&<div className="workspace-rail"><button type="button" aria-label="문서 작업실 열기" aria-controls="document-workspace" aria-expanded={isWorkspaceOpen} onClick={()=>setIsWorkspaceOpen(true)}>문서 작업실 ›</button></div>}
          <EditorPanel insertRef={insertRef} notify={showToast} github={github} isOpen={isWorkspaceOpen} onOpen={()=>setIsWorkspaceOpen(true)} onClose={()=>setIsWorkspaceOpen(false)} theme={theme}/>
          {/* MAIN CHAT AREA */}
          <main className="chat-main flex-1 flex flex-col h-full overflow-hidden relative">
            {/* Header */}
            <header className="h-16 border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md flex items-center justify-between px-4 sm:px-6 shrink-0 z-10">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                  className="md:hidden p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white text-xs"
                >
                  ☰
                </button>
                
                {/* Model Selector */}
                <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-inner">
                  <span className="text-indigo-400 text-xs">⚡</span>
                  {models.length > 0 ? (
                    <select
                      value={selectedModel}
                      onChange={(e) => setSelectedModel(e.target.value)}
                      className="bg-transparent text-xs font-semibold text-slate-200 outline-none cursor-pointer pr-2"
                    >
                      {models.map(m => (
                        <option key={m} value={m} className="bg-slate-900 text-slate-200">
                          {m}
                        </option>
                      ))}
                    </select>
                  ) : (
                    <input
                      type="text"
                      placeholder="모델명 (예: llama3)"
                      value={customModelInput}
                      onChange={(e) => setCustomModelInput(e.target.value)}
                      className="bg-transparent text-xs text-slate-200 placeholder-slate-500 outline-none w-28 sm:w-40"
                    />
                  )}
                  <button 
                    onClick={() => fetchModelList(activeUrl)} 
                    disabled={isLoadingModels || isDemoMode}
                    className="p-1 hover:bg-slate-700 rounded text-slate-400 hover:text-white transition-colors text-xs"
                    title="모델 목록 새로고침"
                  >
                    🔄
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-2 shrink-0"><button className={`text-xs p-2 rounded-lg border whitespace-nowrap ${showDeveloperLogs?'bg-blue-950 text-blue-300 border-blue-500/50':'bg-slate-800 border-slate-700'}`} aria-pressed={showDeveloperLogs} onClick={()=>updateDeveloperLogsVisibility(!showDeveloperLogs)}>Dev Logs {showDeveloperLogs?'ON':'OFF'}</button><button className="text-xs bg-slate-800 p-2 rounded-lg shrink-0" onClick={()=>setIsSettingsOpen(true)}>설정</button></div>
            </header>

            {/* Warning Banner if connection failed */}
            {connectionStatus === 'error' && !isDemoMode && (
              <div className="bg-amber-950/40 border-b border-amber-500/30 px-4 py-2.5 flex items-center justify-between text-xs text-amber-200 flex-wrap gap-2">
                <div className="flex items-center gap-2">
                  <span>⚠️</span>
                  <span><strong>연결 안내:</strong> {errorMessage}</span>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setIsDemoMode(true)}
                    className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors"
                  >
                    시뮬레이터 모드
                  </button>
                </div>
              </div>
            )}

            {/* Chat Body */}
            <div ref={messagesScrollRef} aria-label="채팅 메시지" className="chat-messages flex-1 overflow-y-auto p-4 sm:p-6 space-y-6"
              onScroll={e=>{const pane=e.currentTarget;followMessagesRef.current=pane.scrollHeight-pane.scrollTop-pane.clientHeight<80;}}>
              {currentSession.messages.length === 0 ? (
                /* Welcome Screen */
                <div className="h-full flex flex-col items-center justify-center text-center max-w-2xl mx-auto px-4">
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-xl shadow-indigo-500/20 text-3xl mb-5">
                    ✨
                  </div>
                  <h2 className="text-2xl font-bold text-white mb-2">무엇을 탐구하고 정리할까요?</h2>
                  <p className="text-sm text-slate-400 mb-8 max-w-lg">
                    <span className="text-indigo-300 font-semibold">Ollama Say</span>는 로컬 및 원격 LLM을 통해 즉각적인 대화, 깊이 있는 추론, 실시간 웹 검색 및 학술 논문 초록 비교 분석을 지원합니다.
                  </p>

                  {/* Mode Cards Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full text-left">
                    {Object.values(MODES).map((m) => (
                      <button
                        key={m.id}
                        onClick={() => setActiveMode(m.id)}
                        className={`p-4 rounded-2xl border transition-all text-left group ${
                          activeMode === m.id
                            ? 'bg-slate-800/80 border-indigo-500/40 shadow-lg shadow-indigo-500/5'
                            : 'bg-slate-900/40 border-slate-800 hover:bg-slate-800/50 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center gap-2.5 mb-2">
                          <span className="text-base">{m.id === 'instant' ? '⚡' : m.id === 'reasoning' ? '🧠' : m.id === 'search' ? '🌐' : '📚'}</span>
                          <span className="text-sm font-semibold text-slate-200 group-hover:text-white">{m.name} 모드</span>
                        </div>
                        <p className="text-xs text-slate-400 leading-relaxed">{m.description}</p>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                /* Messages List */
                currentSession.messages.map((msg, idx) => (
                  <div
                    key={idx}
                    className={`flex gap-3 max-w-4xl mx-auto ${
                      msg.role === 'user' ? 'justify-end' : 'justify-start'
                    }`}
                  >
                    {msg.role === 'assistant' && (
                      <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center shrink-0 shadow-md text-sm">
                        🤖
                      </div>
                    )}

                    <div className={`flex flex-col space-y-2 max-w-[88%] sm:max-w-[80%] ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                      {/* Meta Info */}
                      <div className="flex items-center gap-2 text-[11px] text-slate-400 px-1">
                        <span className="font-medium">{msg.role === 'user' ? '나' : msg.model || 'Ollama'}</span>
                        <span>•</span>
                        <span className="capitalize">{msg.mode}</span>
                        <span>•</span>
                        <span>{msg.timestamp}</span>
                      </div>

                      {/* Bubble */}
                      <div className={`rounded-2xl p-4 sm:p-5 text-sm leading-relaxed shadow-sm ${
                        msg.role === 'user'
                          ? 'bg-indigo-600 text-white rounded-tr-none'
                          : msg.isError
                          ? 'bg-rose-950/40 border border-rose-800/60 text-rose-200 rounded-tl-none'
                          : 'bg-slate-900/90 border border-slate-800 text-slate-100 rounded-tl-none'
                      }`}>
                        
                        {/* ACADEMIC PAPERS ABSTRACTS CARD PANEL */}
                        {msg.academicPapers && msg.academicPapers.length > 0 && (
                          <div className="mb-4 p-4 rounded-xl bg-slate-950/90 border border-blue-500/30">
                            <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                              <div className="flex items-center gap-2 text-blue-400 font-semibold text-xs">
                                <span>📚</span>
                                <span>수집된 실제 학술 논문 및 초록 ({msg.academicPapers.length}건)</span>
                              </div>
                              <span className="text-[10px] text-slate-400">OpenAlex · Crossref · arXiv</span>
                            </div>

                            <div className="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                              {msg.academicPapers.map((paper, pIdx) => (
                                <div key={pIdx} className="p-3 rounded-lg bg-slate-900 border border-slate-800/80 hover:border-slate-700 transition-colors">
                                  <div className="flex items-start justify-between gap-2">
                                    <h4 className="text-xs font-semibold text-slate-200">
                                      {paper.title}
                                    </h4>
                                    {paper.doi || paper.url ? (
                                      <a
                                        href={paper.doi || paper.url}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="text-blue-400 hover:text-blue-300 text-xs shrink-0"
                                        title="원문 링크 열기"
                                      >
                                        ↗
                                      </a>
                                    ) : null}
                                  </div>
                                  <div className="flex items-center gap-2 text-[10px] text-slate-400 mt-1 font-mono">
                                    <span className="px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-300 border border-blue-500/30">{paper.source}</span>
                                    <span className="text-blue-300 font-semibold">{paper.citationKey}</span>
                                    <span>|</span>
                                    <span>{paper.journal}</span>
                                    <span>|</span>
                                    <span>피인용 {paper.citedCount}회</span>
                                  </div>
                                  <div className="text-[11px] text-slate-400 mt-1.5 bg-slate-950/60 p-2 rounded border border-slate-800/50 leading-relaxed">
                                    <strong className="text-slate-300">초록(Abstract): </strong>{paper.abstract}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* WEB SEARCH SOURCES PANEL */}
                        {msg.webSources && msg.webSources.length > 0 && (
                          <div className="mb-4 p-3 rounded-xl bg-slate-950/90 border border-emerald-500/30">
                            <div className="flex items-center gap-2 text-emerald-400 font-semibold text-xs mb-2">
                              <span>🌐</span>
                              <span>참조한 실시간 웹 검색 출처</span>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                              {msg.webSources.map((src, sIdx) => (
                                <a
                                  key={sIdx}
                                  href={src.url}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-emerald-500/40 transition-colors flex items-start justify-between gap-1.5"
                                >
                                  <div className="overflow-hidden">
                                    <p className="text-xs font-medium text-slate-200 hover:text-emerald-300 truncate">{src.title}</p>
                                    <p className="text-[10px] text-slate-400 truncate">{src.snippet}</p>
                                  </div>
                                  <span className="text-xs text-slate-500">↗</span>
                                </a>
                              ))}
                            </div>
                          </div>
                        )}

                        {msg.role==='assistant'&&showThinking&&<div className="thinking-panel" aria-label="실시간 추론"><strong>모델 추론</strong><div>{msg.thinking || (isGenerating?'모델의 추론 스트림을 기다리는 중…':'이 응답에는 모델이 제공한 추론 스트림이 없습니다.')}</div></div>}
                        {/* Content text */}
                        <div className="whitespace-pre-wrap leading-relaxed">
                          {msg.content ? (sourceViews[msg.id]?<pre className="answer-source">{msg.content}</pre>:<Markdown text={msg.content} renderDiagrams={msg.id!==activeResponseId} theme={theme}/>) : (
                            <div className="flex items-center gap-2 text-slate-400 py-1">
                              <span className="animate-spin text-indigo-400">🔄</span>
                              <span>답변을 생성하고 있습니다...</span>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Action buttons */}
                      {msg.role === 'assistant' && msg.content && (
                        <div className="flex flex-wrap items-center gap-2 px-1">
                          <button
                            onClick={() => copyToClipboard(msg.content)}
                            className="text-[11px] text-slate-500 hover:text-slate-300 flex items-center gap-1 transition-colors"
                          >
                            <span>📋</span>
                            <span>답변 MD 복사</span>
                          </button>
                          <button className="text-xs text-indigo-300" aria-pressed={!!sourceViews[msg.id]} onClick={()=>setSourceViews(prev=>({...prev,[msg.id]:!prev[msg.id]}))}>{sourceViews[msg.id]?'렌더 보기':'소스 보기'}</button>
                          <button className="text-xs text-indigo-300" onClick={()=>insertRef.current?.(msg.content)}>커서위치 삽입</button>
                          <button className="text-xs text-indigo-300" onClick={()=>copyRendered(msg.content).then(()=>showToast('렌더 복사 완료')).catch(e=>showToast('렌더 복사 실패: '+e.message))}>답변 render 복사</button>
                          <button className="text-xs text-indigo-300" onClick={()=>{try{openDocumentWindow(msg.content);}catch(e){showToast(e.message);}}}>새창 MD/PV</button>
                        </div>
                      )}
                    </div>

                    {msg.role === 'user' && (
                      <div className="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center shrink-0 border border-slate-700 text-sm">
                        👤
                      </div>
                    )}
                  </div>
                ))
              )}

              {/* In-progress status banner */}
              {searchStatus && (
                <div className="flex items-center justify-center my-2">
                  <div className="flex items-center gap-2.5 px-4 py-2 rounded-full bg-indigo-950/80 border border-indigo-500/40 text-indigo-300 text-xs shadow-lg animate-pulse">
                    <span>⏳</span>
                    <span>{searchStatus}</span>
                  </div>
                </div>
              )}

            </div>

            {showDeveloperLogs&&<section className="developer-logs" aria-label="Developer Logs">
              <header><strong className="text-blue-300">Developer Logs</strong><div className="flex items-center gap-2"><span className="text-slate-500">{developerLogs.length} events</span><button type="button" onClick={()=>setDeveloperLogs([])}>지우기</button><button type="button" onClick={()=>updateDeveloperLogsVisibility(false)}>닫기</button></div></header>
              <div className="developer-logs-output" role="log" aria-live="polite">
                {developerLogs.length===0?<div className="text-slate-500">응답을 전송하면 요청, 토큰 스트림, 속도 및 완료 상태가 여기에 표시됩니다.</div>:developerLogs.map(log=><div key={log.id} className={`developer-log-row ${log.level}`}><span className="time">{log.time}</span><span className="level">[{log.level.toUpperCase()}]</span><span>{log.message}{log.detail&&<span className="text-slate-500"> · {log.detail}</span>}</span></div>)}
                <div ref={developerLogsEndRef}/>
              </div>
            </section>}
            {!showDeveloperLogs&&<button type="button" className="developer-logs-restore" onClick={()=>updateDeveloperLogsVisibility(true)}>Developer Logs 열기</button>}

            {/* Input Bar */}
            <div className="chat-composer p-4 sm:p-5 border-t border-slate-800/80 bg-slate-900/50 backdrop-blur-sm shrink-0">
                            {/* Mode Buttons */}
              <div className="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800">
                {Object.values(MODES).map((mode) => {
                  const isActive = activeMode === mode.id;
                  return (
                    <React.Fragment key={mode.id}><button
                      onClick={() => setActiveMode(mode.id)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                        isActive
                          ? `${mode.color} font-bold shadow-sm`
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                      }`}
                      title={mode.description}
                    >
                      <span>{mode.id === 'instant' ? '⚡' : mode.id === 'reasoning' ? '🧠' : mode.id === 'search' ? '🌐' : '📚'}</span>
                      <span className="inline">{mode.name}</span>
                    </button>{mode.id==='reasoning'&&<button type="button" className="px-2 py-1 text-xs rounded bg-violet-950 text-violet-200" aria-pressed={showThinking} onClick={()=>setShowThinking(v=>!v)}>{showThinking?'추론 숨기기':'추론 보기'}</button>}{mode.id==='academic'&&<span className="inline-flex items-center gap-1 ml-1" aria-label="학술검색 개수 설정"><select aria-label="학술검색 개수 선택" value={['10','120','30','50','100'].includes(academicCount)?academicCount:'custom'} onChange={e=>{if(e.target.value==='custom')document.getElementById('academic-count-input')?.focus();else updateAcademicCount(e.target.value);}} className="bg-slate-950 border border-blue-500/40 rounded px-1.5 py-1 text-xs text-blue-200"><option value="custom">직접입력</option><option value="10">10</option><option value="120">120</option><option value="30">30</option><option value="50">50</option><option value="100">100</option></select><input id="academic-count-input" type="number" min="1" max="300" value={academicCount} onChange={e=>setAcademicCount(e.target.value)} onBlur={e=>updateAcademicCount(e.target.value)} aria-label="학술검색 직접 입력 개수" title="1~300건" className="w-16 bg-slate-950 border border-blue-500/40 rounded px-1.5 py-1 text-xs text-blue-100"/><span className="text-[10px] text-slate-400">건</span></span>}</React.Fragment>
                  );
                })}
              </div>

              <form onSubmit={handleSendMessage} className="max-w-4xl mx-auto relative">
                <div className="flex items-center justify-between mb-2 text-xs">
                  <div className="flex items-center gap-2 text-slate-400">
                    <span className="font-semibold text-slate-300">현재 모드:</span>
                    <span className={`px-2 py-0.5 rounded-md text-[11px] font-medium border ${MODES[activeMode.toUpperCase()].badgeColor}`}>
                      {MODES[activeMode.toUpperCase()].name}
                    </span>
                    <span className="text-slate-500 hidden sm:inline">| {MODES[activeMode.toUpperCase()].description}</span>
                  </div>

                    <button
                      type="button"
                      onClick={handleStop}
                      disabled={!isGenerating}
                      aria-label="답변 중지"
                      style={{ opacity: isGenerating ? 1 : 0.45, cursor: isGenerating ? 'pointer' : 'not-allowed' }}
                      className="px-2.5 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-semibold border border-rose-500/30 transition-colors flex items-center gap-1.5"
                    >
                      <span>■ 답변 중지</span>
                    </button>
                </div>

                <div className="relative flex items-center bg-slate-900 rounded-2xl border border-slate-700/80 focus-within:border-indigo-500 shadow-lg transition-all">
                  <textarea
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
                        e.preventDefault();
                        handleSendMessage();
                      }
                    }}
                    placeholder={
                      activeMode === 'academic' 
                        ? "학술 논문 검색 키워드나 주제를 입력하세요 (예: LLM hallucination, Transformer, Quantum error)" 
                        : activeMode === 'search'
                        ? "웹 검색과 함께 탐색할 질문을 입력하세요"
                        : activeMode === 'reasoning'
                        ? "단계별 심층 추론이 필요한 복잡한 질문을 입력하세요"
                        : "질문이나 요청 사항을 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"
                    }
                    rows={1}
                    className="w-full bg-transparent px-4 py-3.5 pr-24 text-sm text-slate-100 placeholder-slate-500 outline-none resize-none max-h-32"
                    style={{ minHeight: '52px' }}
                  />

                  <div className="absolute right-2 flex items-center gap-1.5">
                    <button
                      type="submit"
                      disabled={!inputText.trim() || isGenerating}
                      className={`p-2.5 rounded-xl transition-all font-semibold ${
                        inputText.trim() && !isGenerating
                          ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md hover:opacity-90'
                          : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                      }`}
                      title="전송"
                    >
                      ➔
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </main>

          {/* DOWNLOAD & LOCAL RUN MODAL */}
          {isDownloadModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2 text-indigo-400 font-bold">
                    <span className="text-xl">💾</span>
                    <h3 className="text-slate-100 text-base">내 PC에 앱 다운로드 및 로컬 실행</h3>
                  </div>
                  <button onClick={() => setIsDownloadModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-6 space-y-4 text-xs text-slate-300 leading-relaxed">
                  <div className="p-3.5 bg-indigo-950/50 border border-indigo-500/30 rounded-xl text-indigo-200">
                    💡 <strong>로컬 파일 실행의 장점:</strong><br/>
                    HTML 파일을 다운로드하여 내 PC에서 열면 브라우저 보안(HTTPS ↔ HTTP 통신 차단) 없이 로컬 Ollama(<code className="bg-slate-950 px-1 py-0.5 rounded text-indigo-300">http://127.0.0.1:11434</code>)에 연결할 수 있습니다. 브라우저에 따라 CORS 설정이 필요하며 CDN 라이브러리는 인터넷이 필요합니다.
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-bold text-white">🚀 초간단 실행 방법 (3단계):</h4>
                    <ol className="list-decimal list-inside space-y-1.5 text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800">
                      <li>아래 <strong>[HTML 파일 다운로드]</strong> 버튼을 누릅니다.</li>
                      <li>다운로드된 <code className="text-amber-300">ollama-say.html</code> 파일을 브라우저(Chrome, Edge, Whale 등)로 더블 클릭하여 실행합니다.</li>
                      <li>Ollama가 켜져 있으면 자동으로 로컬 모델을 인식하여 즉시 채팅이 시작됩니다!</li>
                    </ol>
                  </div>
                </div>

                <div className="p-4 bg-slate-950/60 border-t border-slate-800 flex justify-end gap-2">
                  <button
                    onClick={() => setIsDownloadModalOpen(false)}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold"
                  >
                    취소
                  </button>
                  <button
                    onClick={handleDownloadSelf}
                    className="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-white text-xs font-bold shadow-lg"
                  >
                    📥 ollama-say.html 다운로드
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS MODAL */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90dvh]">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-2">
                    <span>⚙️</span>
                    <h3 className="font-bold text-slate-100">Ollama Say 환경설정</h3>
                  </div>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-6 space-y-5 overflow-y-auto min-h-0">
                  <div>
                    <label className="text-xs block mb-2" htmlFor="system-prompt">시스템 프롬프트 (자동 저장)</label>
                    <textarea id="system-prompt" value={systemPrompt} onChange={e=>updateSystemPrompt(e.target.value)} rows={5} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm" placeholder="비워두면 모드별 기본 프롬프트를 사용합니다."/>
                    <p className="text-xs text-slate-400">입력한 프롬프트가 모드 기본 지침을 대체합니다. 검색 자료는 계속 질문에 첨부됩니다.</p>
                    <button className="mt-3 bg-indigo-600 rounded-lg p-2 text-xs" onClick={handleDownloadSelf}>내 PC에 앱 다운로드 (.html)</button>
                    <p className="text-xs text-slate-400 mt-2">HTML 실행에는 CDN 라이브러리 다운로드를 위한 인터넷이 필요합니다. 문서는 브라우저 IndexedDB에 저장되며 앱 다운로드에는 포함되지 않습니다.</p>
                    <p className="text-xs text-slate-400 mt-2">관리자의 ‘챗 열기’로 실행하면 선택한 Ollama 또는 Lemonade NPU 엔진의 모델을 사용합니다. 엔진을 바꾼 뒤 모델 목록을 새로고침하세요.</p>
                  </div>
                  <fieldset className="p-3 rounded-xl border border-slate-700 space-y-2">
